        function is_url(str) {
            regexp = /^(?:(?:https?|ftp):\/\/)?(?:(?!(?:10|127)(?:\.\d{1,3}){3})(?!(?:169\.254|192\.168)(?:\.\d{1,3}){2})(?!172\.(?:1[6-9]|2\d|3[0-1])(?:\.\d{1,3}){2})(?:[1-9]\d?|1\d\d|2[01]\d|22[0-3])(?:\.(?:1?\d{1,2}|2[0-4]\d|25[0-5])){2}(?:\.(?:[1-9]\d?|1\d\d|2[0-4]\d|25[0-4]))|(?:(?:[a-z\u00a1-\uffff0-9]-*)*[a-z\u00a1-\uffff0-9]+)(?:\.(?:[a-z\u00a1-\uffff0-9]-*)*[a-z\u00a1-\uffff0-9]+)*(?:\.(?:[a-z\u00a1-\uffff]{2,})))(?::\d{2,5})?(?:\/\S*)?$/;
            if (regexp.test(str)) {
                return true;
            } else {
                return false;
            }
        }
    </script>

        function support_format_webp() {

                return elem.toDataURL('image/webp').indexOf('data:image/webp') == 0;

                // very old browser like IE 8, canvas not supported
                return false;
            }
        }

    <script>
        // 2. This code loads the IFrame Player API code asynchronously.
        var tag = document.createElement('script');

        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        // 3. This function creates an <iframe> (and YouTube player)
        //    after the API code downloads.
        var player;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player-musica-fondo', {
                height: '10',
                width: '10',
                playerVars: {
                    playlist: 'EH30RAXnRWs',
                    loop: 1
                },
                events: {
                    'onReady': onPlayerReady
                }
            });
        }

        // 4. The API will call this function when the video player is ready.
        function onPlayerReady(event) {
            event.target.setVolume(80);
            // event.target.playVideo();
        }

        // Pausar video
        function pauseVideo() {
            player.pauseVideo();
        }


        // Click en controlador musica
        $('body').on('click', '#play-pause-music', function (e) {

            e.preventDefault();

            // Estado actual
            var estadoMusic = $(this).attr('data-estado-music');

            // Pause music
            if (estadoMusic == 'pause') {
                $(this).attr('data-estado-music', 'play');
                animMusicAnimIcon.play();
                player.playVideo();

            }

            // Play music
            if (estadoMusic == 'play') {
                $(this).attr('data-estado-music', 'pause');
                player.pauseVideo();
                animMusicAnimIcon.stop();
            }


        });
    </script>

    <script>
        // Abrir modal
        $(document).ready(function () {

            // Remuevo mensajes de error anteriores
            $("#error-form").remove();

            // Aquí debes definir el valor de 'evento' manualmente o de otra fuente
            var evento = 'Fiesta'; // Cambia esto por 'Ceremonia' si es necesario

            $('#eventoAsistencia').val(evento);

            if (evento == 'Fiesta') {
                var titleModalAsistencia = lang_titleModalAsistenciaFiesta;
                $('.icon-ceremonia').hide();
                $('.icon-fiesta').show();
            }

            if (evento == 'Ceremonia') {
                var titleModalAsistencia = lang_titleModalAsistenciaCeremonia;
                $('.icon-ceremonia').show();
                $('.icon-fiesta').hide();
            }

            $('#modalAsistencia .modal-title').text(titleModalAsistencia);

            $('#modalAsistencia').modal({
                backdrop: 'static'
            });

        });


        // Validacion de form.
        function isOkAsistencia() {

            // Remuevo mensajes de error anteriores
            $("#error-form").remove();

            // Variables necesarias para la validacion
            var flag = true;
            var err = '';


            // Variables del form para validar.
            var asistencia = document.querySelector('input[name="asistencia"]:checked');
            asistencia = asistencia.value;
            var asistenteName = $.trim($("#nombreAsistente").val());
            var asistenteTelefono = $.trim($("#telefonoAsistente").val());
            var asistenteComentarios = $.trim($("#comentariosAsistente").val());


            // Nombre
            if (asistenteName == '') {
                flag = false;
                err = lang_nombreRequerido;
            } else {
                if (asistenteName.length > 35 || asistenteName.length < 6) {
                    flag = false;
                    err = lang_caracteresNombreAsistencia;
                }
            }
            //Telefono
            var patronTelefono = /^[67]{1}[0-9]{8}$/;

            if (asistenteTelefono == '') {
                flag = false;
                err = lang_telefonoRequerido;
            } else {
                if (!patronTelefono.test(asistenteTelefono)) {
                    flag = false;
                    err = lang_errorTelefono;
                }
            }

            // Comentarios
            if (asistenteComentarios != '') {
                if (asistenteComentarios.length > 100) {
                    flag = false;
                    err = lang_caracteresComentariosAsistencia;
                }
            }

            // Si hay error
            if (flag === false) {

                // Imprimo el error
                $('#formAsistencia').after('<span id="error-form">' + err + '</span>');

            }

            // Retorno el estado de la validacion
            return flag;

        }


        // Enviar asistencia
        $('body').on('click', '#sendAsistencia', function (e) {

            e.preventDefault();


            if (isOkAsistencia()) //Form bien validado
            {

                // Load and disabled buttom.
                $("#sendAsistencia").text(lang_informandoAsistencia + "...");
                $("#sendAsistencia").prop("disabled", true);

                // Obtengo el Form.
                var formulario = $("#formAsistencia")[0];

                // Obtengo los datos del formulario
                var datos = new FormData(formulario);


                // Visualizar como viajan los datos
                // for (var pair of datos.entries()) {
                //   console.log(pair[0] + ", " + pair[1]);
                // }
                var asistencia = document.querySelector('input[name="asistencia"]:checked');
                asistencia = asistencia.value;
                var asistenteName = $.trim($("#nombreAsistente").val());
                var asistenteTelefono = $.trim($("#telefonoAsistente").val());
                var alergenosAsistente = $.trim($("#alergenosAsistente").val());

                // Construir la URL con los parámetros incluidos en la cadena de consulta
                var url = "https://docs.google.com/forms/d/e/1FAIpQLSePCEqTNzb0CJEIQDGIVtEWNeqLYwI0a0Nrb3-Nxvh-JfARuA/formResponse?usp=pp_url" +
                    "&entry.586665967=" + encodeURIComponent(asistencia) +
                    "&entry.1097819900=" + encodeURIComponent(asistenteName) +
                    "&entry.763108689=" + encodeURIComponent(asistenteTelefono) +
                    "&entry.1946534993=" + encodeURIComponent(alergenosAsistente);

                // Realizar la solicitud GET con fetch
                const requestOptions = {
                    method: "GET",
                    redirect: "follow",
                    mode: 'no-cors'
                };


                // Envio con fetch los datos mediante POST
                fetch(url, requestOptions)
                    // Promesas fetch
                    //.then(res => res.json())
                    .then(response => {

                        // Si recibo error 
                        //if (data.error === true) {
                        //
                        //  $("#sendAsistencia").text(lang_confirmarAsistencia);
                        //  $("#sendAsistencia").prop("disabled", false);
                        //
                        //  // Imprimo el error
                        //  $('#formAsistencia').after('<span id="error-form">' + data.desc + '</span>');
                        //}

                        // Si no hay error 
                        if (response.ok === false) {

                            $("#sendAsistencia").text(lang_confirmarAsistencia);
                            $("#sendAsistencia").prop("disabled", false);


                            // Oculto elementos del form y reseteo
                            $('#formAsistencia')[0].reset();

    <!-- Cuenta regresiva -->
    <script>
        // Set the date we're counting down to
        var countDownDate = new Date(fechaCuentaRegresiva).getTime();

        // Update the count down every 1 second
        var x = setInterval(function () {

            // Get today's date and time
            var now = new Date().getTime();

            // Find the distance between now and the count down date
            var distance = countDownDate - now;

            // Time calculations for days, hours, minutes and seconds
            var days = Math.floor(distance / (1000 * 60 * 60 * 24));
            var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            var seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Display the result in the element with id="demo"
            // document.getElementById("reloj").innerHTML = days + " días " + hours + "hs " +
            //   minutes + "m " + seconds + "s ";

            $("#dias .number").text(days);
            $("#horas .number").text(hours);
            $("#minutos .number").text(minutes);
            $("#segundos .number").text(seconds);



            // If the count down is finished, write some text
            if (distance < 0) {
                clearInterval(x);
                document.getElementById("reloj").innerHTML = '<p class="fin-cuenta">' +
                    lang_textoFinalCuentaRegresiva + '</p>';
                $('.falta').text('');
            }
        }, 1000);
    </script>

        $('body').on('click', 'a.sugerir-cancion', function (e) {

            $("#error-form").remove();

            $('#modalSugerirCancion').modal({
                backdrop: 'static'
            })

        });



        // Validacion de form.
        function isOkSugerirCancion() {


            // Remuevo mensajes de error anteriores
            $("#error-form").remove();

            // Variables necesarias para la validacion
            var flag = true;
            var err = '';


            // Variables del form para validar.
            var sugerenciaName = $.trim($("#nombreSugerencia").val());
            var sugerenciaDescription = $.trim($("#descripcionSugerencia").val());
            var sugerenciaLink = $.trim($("#linkSugerencia").val());



            // Descripcion
            if (sugerenciaDescription == '') {
                flag = false;
                err = lang_cancionRequerida;
            } else {
                if (sugerenciaDescription.length > 50) {
                    flag = false;
                    err = lang_caracteresCancionSugerencia;
                }
            }

            // Link
            if (sugerenciaLink != '') {

                if (!is_url(sugerenciaLink)) {
                    flag = false;
                    err = lang_linkIncorrecto;
                }
                if (sugerenciaLink.length > 250) {
                    flag = false;
                    err = lang_caracteresLinkSugerencia;
                }

            }

            // Nombre
            if (sugerenciaName == '') {
                flag = false;
                err = lang_nombreRequerido;
            } else {
                if (sugerenciaName.length > 20) {
                    flag = false;
                    err = lang_caracteresNombreSugerencia;
                }
            }


            // Si hay error
            if (flag === false) {

                // Imprimo el error
                $('#formSugerirCancion').after('<span id="error-form">' + err + '</span>');

            }

            // Retorno el estado de la validacion
            return flag;

        }



        // Enviar sugerencia
        $('body').on('click', '#sendSugerenciaCancion', function (e) {

            e.preventDefault();


            if (isOkSugerirCancion()) //Form bien validado
            {

                $("#sendSugerenciaCancion").text(lang_enviandoSugerencia + "...");
                $("#sendSugerenciaCancion").prop("disabled", true);

                // Obtengo el Form.
                var formulario = $("#formSugerirCancion")[0];

                // Obtengo los datos del formulario

                // Visualizar como viajan los datos
                for (var pair of datos.entries()) {
                    console.log(pair[0] + ", " + pair[1]);

                var url = "https://docs.google.com/forms/d/e/1FAIpQLSfqgoVGzbCOtlDkHjbvzPmFyojz0_YrqI_QmSw0vBG5-4fNqg/formResponse?usp=pp_url" +

                    "&entry.1033698377=" + encodeURIComponent(datos.get('descripcion')) +
                    "&entry.396415919=" + encodeURIComponent(datos.get('link'));


                const requestOptions = {
                    method: "GET",
                    redirect: "follow",

                };


                // Envio con fetch los datos mediante POST

    <!-- Divisiones adornos svg -->
    <script>
        let anchoAdorno
        let containerAdorno = $('.inv-container')
        let adornoInject = `<img class="injectable adorno-borde" src="./adorno_divisor.svg" alt="">`;

        function createBordeAdornos() {

            let anchoContainer = containerAdorno.width()

            anchoAdorno = 120 //Verificar en css que tenga este ancho en px (Responsive)

            if (anchoContainer > 767) {
                anchoAdorno = 180 //Verificar en css que tenga este ancho en px 
            }

            let cantidadAdornos = parseInt(anchoContainer / anchoAdorno)
            let adornosHtml = ''

            for (let index = 0; index < cantidadAdornos; index++) {
                adornosHtml += adornoInject
            }

            $('.adornos-divisor').html(adornosHtml)

        }

        function removeBordesAdornos() {
            $('.adornos-divisor').html("")
        }

        createBordeAdornos();

        $(window).resize(function () {
            removeBordesAdornos()
            createBordeAdornos()
            injectsSVGs()
        });
    </script>
